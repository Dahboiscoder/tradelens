services:
  postgres:
    image: postgres:16-alpine
    container_name: tradelens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradelens
      POSTGRES_PASSWORD: tradelens
      POSTGRES_DB: tradelens
    ports:
      - "5435:5432"
    volumes:
      - tradelens_postgres_data:/var/lib/postgresql/data

volumes:
  tradelens_postgres_data:
